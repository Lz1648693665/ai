spring:
  datasource:
    url: jdbc:h2:mem:devpilot-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

devpilot:
  jwt:
    secret: devpilot-test-secret
    expiration-seconds: 3600
