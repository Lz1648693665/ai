server:
  port: 8080

spring:
  application:
    name: devpilot-server

  datasource:
    url: jdbc:h2:file:./data/devpilot-db
    driver-class-name: org.h2.Driver
    username: sa
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

devpilot:
  jwt:
    secret: devpilot-local-secret-change-me
    expiration-seconds: 604800
